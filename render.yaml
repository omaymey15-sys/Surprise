services:
  - type: web
    name: surprise-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: surprise-db
          property: connectionString

databases:
  - name: surprise-db
    plan: free
